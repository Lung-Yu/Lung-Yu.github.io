<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=/#/404">
  <script>
    // This script redirects to the root path with the hash fragment
    var path = window.location.pathname;
    var hash = window.location.hash;
    var newUrl = window.location.origin + '/#' + path + hash;
    window.location.replace(newUrl);
  </script>
</head>
<body>
  <h1>Page Not Found</h1>
  <p>Redirecting...</p>
</body>
</html>
